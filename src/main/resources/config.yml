# ==========================================================
#                     MerchantTalk
#   PNJ marchands qui parlent, porte d'entrée du shop
#   EconomyShopGUI. La configuration des PNJ, des phrases
#   et des voix se fait depuis l'interface web.
# ==========================================================

web:
  enabled: true
  # Adresse d'écoute. 0.0.0.0 = toutes les interfaces.
  bind: 0.0.0.0
  # Port du site. Sur Minestrator, ajoute ce port dans les "ports supplémentaires"
  # du panel et mets ici le numéro qu'il t'a attribué.
  port: 8085
  # Adresse publique du site, telle que les JOUEURS peuvent l'atteindre.
  # Elle sert à télécharger le resource pack. Exemple : http://123.45.67.89:8085
  public-url: "http://127.0.0.1:8085"
  # Mot de passe du site. S'il est vide, un mot de passe est généré au premier démarrage
  # et affiché dans la console.
  password: ""
  # Durée de validité d'une connexion au site (en heures).
  session-hours: 12

resource-pack:
  enabled: true
  # true = le joueur doit accepter le pack, sinon il est expulsé.
  required: true
  prompt: "<gold>Ce serveur utilise des voix pour ses marchands. Accepte le pack pour les entendre !"
  kick-message: "<red>Tu dois accepter le resource pack du serveur pour jouer."
  # Renvoie automatiquement le pack aux joueurs connectés quand une voix est ajoutée/supprimée.
  resend-on-change: true
  # Formats de pack acceptés (min_format / max_format du pack.mcmeta).
  min-format: 69
  max-format: 999
  description: "Voix des marchands (MerchantTalk)"

shop:
  # Commandes lancées par la CONSOLE pour ouvrir le shop au joueur.
  # {player} = pseudo du joueur, {section} = section EconomyShopGUI du PNJ.
  open-command-section: "shop {section} {player}"
  open-command-main: "shop {player}"
  # Commande des marchands en mode « Menu de vente » : le joueur y dépose tous ses objets,
  # ils sont vendus à la fermeture.
  open-command-sellgui: "sellgui {player}"
  # Bloque les commandes d'EconomyShopGUI pour les joueurs (sauf permission merchanttalk.bypass).
  block-commands: true
  # Bloque aussi automatiquement TOUTES les commandes déclarées par EconomyShopGUI.
  block-all-economyshopgui-commands: true
  # Commandes bloquées en plus (sans le /).
  blocked-commands:
    - shop
    - sellall
    - sellgui
    - sell
  # Annule toute transaction faite en dehors d'un PNJ (sécurité supplémentaire).
  block-transactions-outside-npc: true

dialogue:
  # Format du message dans le chat. Tags : <npc> (nom du PNJ), <text> (la phrase), <player>.
  chat-format: "<npc> <dark_gray>»</dark_gray> <white><text>"
  # Temps minimum entre deux phrases d'achat/vente pour un même joueur (millisecondes).
  min-interval-ms: 1200
  # Quand le marchand parle déjà et qu'une nouvelle réplique arrive (ex. le joueur ferme le shop
  # pendant la réplique d'achat) :
  #   false = il FINIT sa phrase puis enchaîne la suivante (recommandé)
  #   true  = la nouvelle réplique coupe la voix en cours
  interrupt: false
  # Pause entre deux répliques enchaînées (millisecondes).
  queue-gap-ms: 300
  # Une réplique qui devrait attendre plus longtemps que ça est abandonnée (millisecondes).
  max-queue-ms: 15000
  # Volume des voix. 1.0 = normal.
  volume: 1.0
  # Distance (en blocs) à laquelle la voix n'est plus audible. Le son est spatialisé :
  # il vient du PNJ et baisse avec la distance.
  hearing-distance: 16
  # Fréquence de vérification des joueurs qui s'approchent (en ticks, 20 = 1 seconde).
  greet-check-ticks: 10
  # Chaque réplique peut avoir une condition d'heure (matin, jour, soir, nuit) et de météo.
  # true = si une réplique spéciale correspond au moment (ex. « Nuit » la nuit), le marchand
  # la choisit en priorité plutôt qu'une réplique « Toujours ». false = tout est mélangé.
  prefer-specific: true
  # Plages horaires en HEURES DU JEU (6h = lever du soleil, 18h = coucher). "19-6" passe minuit.
  # Les plages peuvent se chevaucher (ex. 18h est à la fois « jour » et « soir »).
  time-periods:
    morning: "5-9"
    day: "6-19"
    evening: "17-20"
    night: "19-6"
  # Particules au-dessus du PNJ pendant qu'il parle (désactivables aussi PNJ par PNJ sur le site).
  particles:
    enabled: true
    # Type de particule Bukkit sans données : NOTE, HEART, HAPPY_VILLAGER, ENCHANT...
    type: NOTE

ai:
  # Conversation libre avec les marchands grâce à une IA. Désactivé par défaut.
  # Chaque marchand s'active et reçoit sa personnalité sur le site (carte « Conversation IA »).
  # En jeu : près du marchand, le joueur écrit dans le chat en l'appelant (« @Bjorn salut ! »
  # ou « Bjorn, tu vends quoi ? ») et le marchand répond dans le chat.
  # ⚠ Les messages des joueurs qui parlent aux marchands sont envoyés au fournisseur d'IA choisi.
  enabled: false
  # groq    = https://console.groq.com/keys (gratuit, très rapide)
  # gemini  = Google AI Studio : https://aistudio.google.com/apikey (gratuit avec limites)
  # openai  = toute API compatible OpenAI (OpenAI, Mistral, OpenRouter...) : renseigne base-url
  provider: groq
  # Ta clé API (ne la partage jamais). Elle n'est jamais affichée sur le site.
  api-key: ""
  # Modèles Groq actuels : openai/gpt-oss-20b (rapide), openai/gpt-oss-120b (plus malin).
  # Liste : https://console.groq.com/docs/models
  # Modèle. Vide = modèle par défaut : groq → openai/gpt-oss-20b,
  # gemini → gemini-2.5-flash, openai → gpt-4o-mini.
  model: ""
  # Uniquement pour provider: openai. Ex : https://api.mistral.ai/v1 ou https://openrouter.ai/api/v1
  base-url: ""
  # Distance max (blocs) entre le joueur et le marchand pour lui parler.
  talk-radius: 8
  # true  = il faut appeler le marchand par son nom (ou un surnom) pour qu'il réponde.
  # false = tout message écrit près d'un marchand IA lui est adressé (le plus proche).
  require-mention: true
  # Après une réponse, le joueur peut continuer à lui parler sans le renommer pendant X secondes.
  follow-up-seconds: 40
  # Qui voit la réponse : nearby = tous les joueurs proches du marchand, player = seulement celui qui parle.
  reply-to: nearby
  # Langue des réponses.
  language: français
  # Longueur max d'une réponse (caractères).
  max-reply-chars: 220
  max-tokens: 200
  # 0 = toujours la même réponse, 1+ = plus créatif.
  temperature: 0.8
  # Nombre de messages précédents dont le marchand se souvient (par joueur).
  history: 8
  # Délai minimum entre deux questions d'un même joueur (secondes).
  cooldown-seconds: 3
  # Limite pour tout le serveur, pour protéger ton quota (0 = illimité).
  max-requests-per-minute: 30
  # true = le marchand connaît les objets et les vrais prix de sa boutique (lus dans EconomyShopGUI)
  # et peut répondre à « combien le diamant ? ».
  share-prices: true
  # Nombre maximum d'objets envoyés à l'IA (au-delà, la liste est coupée).
  max-catalog-items: 150
  # Règles ajoutées à toutes les personnalités (ex : "Ne parle jamais de politique.").
  extra-rules: ""
  # Affiché au-dessus de la barre d'action pendant que le marchand réfléchit (vide = rien).
  thinking-message: "<gray><i><npc> <gray><i>réfléchit…"
  # Si l'IA ne répond pas (clé invalide, quota dépassé...). Vide = rien.
  error-message: "<gray><i><npc> <gray><i>ne semble pas t'avoir entendu."

messages:
  prefix: "<gold>[MerchantTalk]</gold> "
  command-blocked: "<red>Le shop n'est accessible qu'auprès d'un marchand !"
  transaction-blocked: "<red>Tu dois passer par un marchand pour acheter ou vendre."
  # Si le marchand n'a pas de réplique « Joueur sans la permission requise ».
  no-permission: "<red>Ce marchand refuse de commercer avec toi."
  # Clic sur un marchand fermé (s'il n'a pas de réplique « boutique fermée »). <hours> = ses horaires.
  closed: "<gray>La boutique est fermée. Reviens entre <yellow><hours></yellow> (heure du jeu)."
  # Envoyé au joueur à l'ouverture du shop pendant une promo (vide = rien). <promo> = la promo.
  promo-active: "<gold>★ <yellow><promo></yellow> !"
  # Annonce à tout le serveur quand un marchand ambulant change de place (vide = rien).
  # <npc>, <spot> (nom de l'emplacement), <x> <y> <z>, <world>.
  wander-arrived: "<gold>[Marchand]</gold> <npc> <gray>s'est installé à <yellow><spot></yellow> <dark_gray>(<x>, <y>, <z>)"
